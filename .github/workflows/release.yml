name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ensure Execution Permissions
        run: |
          chmod +x easytier/bin/* || true
          chmod +x easytier/scripts/* || true
          chmod +x easytier/*.sh || true

      - name: Build Package
        run: |
          python pack.py

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            easytier.tar.gz
            easytier.tar.gz.md5
          draft: false
          prerelease: false
          generate_release_notes: true
